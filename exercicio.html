<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validação de Campos Numéricos</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f6f8fa;
        margin: 50px;
      }
      form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        max-width: 300px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="number"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
      button {
        padding: 10px 15px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      .mensagem {
        margin-top: 15px;
        font-weight: bold;
      }
      .sucesso {
        color: green;
      }
      .erro {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>Formulário de Validação Numérica</h2>

    <form id="formNumeros">
      <label for="campoA">Campo A:</label>
      <input type="number" id="campoA" name="campoA" required />

      <label for="campoB">Campo B:</label>
      <input type="number" id="campoB" name="campoB" required />

      <button type="submit">Enviar</button>

      <div id="mensagem" class="mensagem"></div>
    </form>

    <script>
      const form = document.getElementById("formNumeros");
      const mensagem = document.getElementById("mensagem");

      form.addEventListener("submit", function (event) {
        event.preventDefault(); // evita recarregar a página

        const valorA = parseFloat(document.getElementById("campoA").value);
        const valorB = parseFloat(document.getElementById("campoB").value);

        if (valorB > valorA) {
          mensagem.textContent =
            "✅ Formulário válido! O número B é maior que o número A.";
          mensagem.className = "mensagem sucesso";
        } else {
          mensagem.textContent =
            "❌ Formulário inválido! O número B deve ser maior que o número A.";
          mensagem.className = "mensagem erro";
        }
      });
    </script>
  </body>
</html>
